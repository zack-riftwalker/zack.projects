<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>کتابخانه‌ی یادداشت‌ها — خوانا</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header class="top">
      <img src="../../icons/icon48.png" alt="" width="36" height="36" />
      <div>
        <h1>کتابخانه‌ی یادداشت‌ها</h1>
        <p class="sub" id="stats"></p>
      </div>
      <div class="actions">
        <button class="btn" id="exportMd">دانلود همه (Markdown)</button>
        <button class="btn ghost" id="exportJson">پشتیبان‌گیری (JSON)</button>
        <label class="btn ghost">
          بازگردانی پشتیبان
          <input type="file" id="importJson" accept="application/json,.json" hidden />
        </label>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab on" data-tab="convs">گفتگوها</button>
      <button class="tab" data-tab="vocab">لغت‌نامه‌ی من</button>
      <button class="tab" data-tab="stats">آمار مطالعه</button>
    </nav>

    <section id="tab-vocab" hidden>
      <div class="toolbar">
        <input type="search" id="vq" placeholder="جستجو در لغت‌ها…" dir="auto" />
        <div class="row">
          <button class="btn ghost small" id="vocabCsv">خروجی CSV (برای Anki)</button>
          <span class="sub" id="vocabCount"></span>
        </div>
      </div>
      <main id="vocabList"></main>
    </section>

    <section id="tab-stats" hidden>
      <main id="statsBox"></main>
    </section>

    <section id="tab-convs">
    <div class="toolbar">
      <input type="search" id="q" placeholder="جستجو در هایلایت‌ها، یادداشت‌ها و دفترچه‌ها…" dir="auto" />
      <div class="chips" id="filters"></div>
    </div>

    <main id="list"></main>
    </section>

    <template id="empty">
      <div class="empty">
        <p>هنوز یادداشتی ذخیره نشده.</p>
        <p>یک گفتگو در <a href="https://claude.ai" target="_blank" rel="noopener">claude.ai</a> یا چت Notion AI باز کن، متنی را انتخاب کن و هایلایت یا یادداشت بزن.</p>
      </div>
    </template>

    <script src="../shared/defaults.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/export.js"></script>
    <script src="../shared/fonts-page.js"></script>
    <script src="library.js"></script>
  </body>
</html>
