<!doctype html>
<html lang="en" data-theme="claude" data-mode="light" data-color-version="v2">
  <head>
    <meta charset="utf-8" />
    <title>Mock chat - Claude</title>
    <!-- A small stand-in for claude.ai: same class names / data attributes the
         extension relies on, rendered with React so re-renders are realistic. -->
    <style>
      :root, [data-theme=claude][data-mode=light] {
        --bg-000: 0 0% 100%; --bg-100: 48 33.3% 97.1%; --bg-200: 53 28.6% 94.5%; --bg-300: 48 25% 92.2%;
        --text-000: 60 2.6% 7.6%; --text-100: 60 2.6% 7.6%; --text-300: 60 2.5% 23.3%; --text-500: 51 3.1% 43.7%;
        --border-300: 51 16.5% 84.5%;
        --font-claude-response: Georgia, "Times New Roman", serif;
        --font-user-message: system-ui, sans-serif;
      }
      [data-theme=claude][data-mode=dark] {
        --bg-000: 60 2.1% 18.4%; --bg-100: 60 2.7% 14.5%; --bg-200: 30 3.3% 11.8%; --bg-300: 60 2.6% 7.6%;
        --text-000: 48 33.3% 97.1%; --text-100: 48 33.3% 97.1%; --text-300: 50 9% 73.7%; --text-500: 48 4.8% 59.2%;
        --border-300: 30 3.3% 11.8%;
      }
      body { margin: 0; background: hsl(var(--bg-100)); color: hsl(var(--text-100)); font-family: system-ui, sans-serif; }
      .app { display: flex; height: 100vh; }
      nav { width: 230px; background: hsl(var(--bg-200)); padding: 16px; border-right: 1px solid hsl(var(--border-300)); }
      nav a { display: block; color: hsl(var(--text-300)); padding: 6px 0; }
      .scroller { flex: 1; overflow-y: auto; }
      .column { max-width: 768px; margin: 0 auto; padding: 24px 16px 160px; display: flex; flex-direction: column; gap: 22px; }
      [data-testid=user-message] { background: hsl(var(--bg-300)); border-radius: 12px; padding: 10px 14px; align-self: flex-end; max-width: 80%; font-family: var(--font-user-message); }
      .font-claude-response { font-family: var(--font-claude-response); font-weight: 360; line-height: 1.65; }
      .standard-markdown { display: grid; gap: .625rem; }
      .standard-markdown :is(p, blockquote, h1, h2, h3) { padding-left: .5rem; }
      .standard-markdown :is(p, blockquote, ul, ol, h1, h2, h3) { padding-right: 2rem; margin: 0; }
      .standard-markdown ul { list-style: disc; padding-left: 1.75rem; }
      .standard-markdown ol { list-style: decimal; padding-left: 1.75rem; }
      .standard-markdown blockquote { border-left: 4px solid hsl(var(--border-300)); padding-left: 1rem; }
      pre { background: hsl(var(--bg-300)); padding: 12px; border-radius: 8px; overflow-x: auto; }
      /* icons drawn with an icon font, like the artifact cards / tool rows of claude.ai */
      @font-face { font-family: "Anthropic Glyphs"; src: local("DejaVu Sans"); }
      .glyph { font-family: "Anthropic Glyphs"; }
      .artifact-card { display: flex; gap: 10px; align-items: center; border: 1px solid hsl(var(--border-300)); border-radius: 10px; padding: 10px; font-family: system-ui, sans-serif; }
      .tool-row { font-family: system-ui, sans-serif; font-size: 14px; color: hsl(var(--text-500)); }
      /* code block whose colors are fixed inline (syntax theme for dark mode) */
      .code-wrap { background: hsl(var(--bg-300)); border-radius: 8px; }
      .code-wrap pre { background: transparent; }
      code { font-family: ui-monospace, monospace; font-size: .9em; }
      table { border-collapse: collapse; } td, th { border: 1px solid hsl(var(--border-300)); padding: 4px 8px; }
      .actions button { font-size: 12px; }
      .composer { position: sticky; bottom: 0; max-width: 768px; margin: 0 auto; padding: 12px 16px; }
      .ProseMirror { background: hsl(var(--bg-000)); border: 1px solid hsl(var(--border-300)); border-radius: 14px; padding: 12px; min-height: 40px; }
      /* ---- "v3" variant used for /code/…: different markup and variable names ---- */
      html.v3 { --surface-page: #141413; --surface-raised: oklch(0.27 0.004 90); --text-primary: #f0eee6; --text-secondary: 50 6% 68%; --border-subtle: #34332f; }
      html.v3.light { --surface-page: #faf9f5; --surface-raised: oklch(0.97 0.004 90); --text-primary: #1f1e1d; --text-secondary: 50 4% 40%; --border-subtle: #e2dfd6; }
      html.v3 body { background: var(--surface-page); color: var(--text-primary); }
      .v3 .shell { display: flex; height: 100vh; }
      .v3 .side-rail { width: 220px; background: var(--surface-raised); padding: 14px; }
      .v3 .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .v3 .scroll-area { flex: 1; overflow-y: auto; background: #1a1a19; } /* hard-coded: no variable */
      .v3.light .scroll-area { background: #f4f2ec; }
      .v3 .transcript { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 18px; }
      .v3 .turn-user .bubble { background: var(--surface-raised); border-radius: 12px; padding: 10px 14px; white-space: pre-wrap; align-self: flex-end; }
      .v3 .turn-user { display: flex; justify-content: flex-end; }
      .v3 .markdown { line-height: 1.7; }
      .v3 .markdown p { margin: 0 0 10px; }
      .v3 .tool-card { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 8px 12px; color: var(--text-secondary); }
      .v3 .composer-wrap { padding: 12px 16px; border-top: 1px solid var(--border-subtle); background: var(--surface-page); }
      .v3 textarea { width: 100%; min-height: 50px; background: var(--surface-raised); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/__mock/react.js"></script>
    <script src="/__mock/react-dom.js"></script>
    <script>
      const e = React.createElement;
      const CONVS = {
        '11111111-2222-3333-4444-555555555555': {
          title: 'آموزش React Hooks',
          messages: [
            { role: 'user', text: 'useEffect در React دقیقاً چه کاری انجام می‌دهد؟ لطفاً ساده توضیح بده.' },
            {
              role: 'assistant',
              blocks: [
                ['h2', 'useEffect چیست؟'],
                ['p', 'هوک useEffect به شما اجازه می‌دهد بعد از رندر شدن کامپوننت، کارهای جانبی (side effects) انجام دهید؛ مثلاً گرفتن داده از API یا تنظیم یک تایمر.'],
                ['p', 'این هوک دو ورودی می‌گیرد: یک تابع و یک آرایه‌ی وابستگی (dependency array). React هر بار که یکی از وابستگی‌ها تغییر کند، تابع را دوباره اجرا می‌کند.'],
                ['ul', ['اگر آرایه خالی باشد، فقط یک بار بعد از mount اجرا می‌شود.', 'اگر آرایه را ندهید، بعد از هر render اجرا می‌شود.', 'تابع برگشتی (cleanup) قبل از اجرای بعدی صدا زده می‌شود.']],
                ['pre', "useEffect(() => {\n  const id = setInterval(tick, 1000);\n  return () => clearInterval(id);\n}, []);"],
                ['blockquote', 'نکته: هیچ‌وقت state را بدون شرط داخل useEffect تغییر ندهید، وگرنه حلقه‌ی بی‌نهایت می‌سازید.'],
                ['p', 'In English: useEffect lets you synchronize a component with an external system, such as a network request or a browser API.'],
                ['table', [['حالت', 'زمان اجرا'], ['[]', 'فقط یک بار'], ['[a, b]', 'وقتی a یا b عوض شود']]],
                ['ol', ['کامپوننت رندر می‌شود.', 'DOM به‌روزرسانی می‌شود.', 'useEffect اجرا می‌شود.']],
                ['tools', 'Read a file, created a file, ran a command'],
                ['artifact', 'آزمون فصل ۲: آماده‌سازی درس'],
                ['pre-dark', 'این متن را Claude داخل بلوک کد نوشته و باید خوانا بماند.\nخط دوم همین متن.'],
                ['p-faint', 'این جمله با رنگ ثابتِ روشن نوشته شده است.'],
              ],
            },
            { role: 'user', text: 'مرسی! یک مثال واقعی هم بزن.' },
            {
              role: 'assistant',
              blocks: [
                ['p', 'حتماً. فرض کنید می‌خواهیم لیست کاربران را از سرور بگیریم و نمایش دهیم. ابتدا یک state به نام users می‌سازیم.'],
                ['p', 'سپس در useEffect با fetch درخواست می‌فرستیم و نتیجه را با setUsers ذخیره می‌کنیم. این الگو در بیشتر پروژه‌های واقعی دیده می‌شود.'],
                ['h2', 'مدیریت خطا'],
                ...Array.from({ length: 10 }, (_, i) => ['p', `نکته‌ی شماره‌ی ${i + 1} درباره‌ی مدیریت خطا: همیشه حالت‌های بارگذاری و خطا را جداگانه نگه دارید تا کاربر بداند چه اتفاقی افتاده است. این کار تجربه‌ی کاربری را بهتر می‌کند و اشکال‌زدایی را ساده‌تر.`]),
              ],
            },
          ],
        },
        '99999999-8888-7777-6666-555555555555': {
          title: 'Other chat',
          messages: [
            { role: 'user', text: 'What is photosynthesis?' },
            { role: 'assistant', blocks: [['p', 'Photosynthesis is the process plants use to turn light into chemical energy.']] },
          ],
        },
      };

      function Inline({ text }) {
        // `code` spans like markdown inline code
        const parts = text.split(/(\b(?:useEffect|useState|setUsers|users|fetch|React|API|side effects|dependency array|cleanup|mount|render)\b)/g);
        return parts.map((p, i) => (i % 2 ? (/^(useEffect|useState|setUsers|users|fetch)$/.test(p) ? e('code', { key: i }, p) : p) : p));
      }

      function Block({ b }) {
        const [tag, content] = b;
        if (tag === 'ul' || tag === 'ol') return e(tag, null, content.map((t, i) => e('li', { key: i }, e(Inline, { text: t }))));
        if (tag === 'pre') return e('div', null, e('div', { className: 'code-head' }, e('span', null, 'javascript'), e('button', null, 'Copy')), e('pre', null, e('code', null, content)));
        if (tag === 'table') return e('div', null, e('table', null, e('tbody', null, content.map((r, i) => e('tr', { key: i }, r.map((c, j) => e(i ? 'td' : 'th', { key: j }, c)))))));
        if (tag === 'blockquote') return e('blockquote', null, e('p', null, content));
        if (tag === 'tools') return e('div', { className: 'tool-row' }, content + ' ', e('span', { className: 'glyph chev' }, '9'));
        if (tag === 'artifact')
          return e(
            'div',
            { className: 'artifact-card' },
            e('span', { className: 'glyph doc' }, '\uE10A'),
            e('div', null, e('div', { className: 'artifact-title' }, content), e('div', { className: 'artifact-meta' }, 'Artifact · ', e('span', { className: 'glyph lock' }, '\uE0F2'), ' Only you ', e('span', { className: 'emo' }, '📚')))
          );
        if (tag === 'pre-dark') return e('div', { className: 'code-wrap' }, e('div', { className: 'code-head' }, e('span', null, 'text')), e('pre', null, e('code', { style: { color: 'rgb(171, 178, 191)' } }, content)));
        if (tag === 'p-faint') return e('p', null, e('span', { className: 'faint', style: { color: '#ece6d6' } }, content));
        return e(tag, null, e(Inline, { text: content }));
      }

      function Message({ m, streaming }) {
        if (m.role === 'user')
          return e('div', { 'data-testid': 'user-message', className: 'font-user-message' }, e('p', { className: 'whitespace-pre-wrap' }, m.text));
        return e(
          'div',
          { 'data-is-streaming': String(!!streaming), className: 'group relative' },
          e('div', { className: 'font-claude-response' }, e('div', { className: 'standard-markdown grid-cols-1 grid gap-2.5' }, m.blocks.map((b, i) => e(Block, { key: i, b })))),
          e('div', { className: 'actions', role: 'group', 'aria-label': 'Message actions' }, e('button', null, 'Copy'), e('button', null, 'Retry'))
        );
      }

      const CODE_TURNS = [
        { role: 'user', text: 'یک تابع پایتون بنویس که فایل CSV را بخواند.' },
        {
          role: 'assistant',
          blocks: [
            ['p', 'حتماً. برای خواندن فایل CSV در پایتون بهتر است از ماژول استاندارد csv استفاده کنیم؛ این ماژول نیاز به نصب ندارد.'],
            ['tool', 'Read file: data/users.csv'],
            ['pre', 'import csv\n\ndef read_rows(path):\n    with open(path, newline="") as f:\n        return list(csv.DictReader(f))'],
            ['p', 'این تابع هر سطر را به صورت یک دیکشنری برمی‌گرداند و کلیدها همان عنوان ستون‌ها هستند.'],
            ['ul', ['اگر فایل بزرگ است، به‌جای list از حلقه استفاده کنید.', 'برای encoding فارسی، پارامتر encoding را utf-8 بگذارید.']],
          ],
        },
      ];

      function CodeApp() {
        const [gen, setGen] = React.useState(0);
        React.useEffect(() => {
          window.__remount = () => setGen((g) => g + 1);
          document.title = 'Claude Code';
        }, []);
        const block = ([tag, content], i) => {
          if (tag === 'ul') return e('ul', { key: i }, content.map((t, j) => e('li', { key: j }, t)));
          if (tag === 'pre') return e('pre', { key: i }, e('code', null, content));
          if (tag === 'tool') return e('div', { key: i, className: 'tool-card' }, content);
          return e(tag, { key: i }, content);
        };
        return e(
          'div',
          { className: 'shell' },
          e('div', { className: 'side-rail' }, e('b', null, 'Claude Code'), e('div', null, 'Sessions')),
          e(
            'div',
            { className: 'main' },
            e(
              'div',
              { className: 'scroll-area' },
              e(
                'div',
                { className: 'transcript', key: gen },
                CODE_TURNS.map((t, i) =>
                  t.role === 'user'
                    ? e('div', { key: i, className: 'turn-user', 'data-role': 'user' }, e('div', { className: 'bubble' }, t.text))
                    : e('div', { key: i, className: 'turn-assistant' }, e('div', { className: 'markdown prose' }, t.blocks.map(block)))
                )
              )
            ),
            e('div', { className: 'composer-wrap' }, e('textarea', { placeholder: 'Reply…' }))
          )
        );
      }

      // ---- virtual list like the current claude.ai (rows with data-index, only
      // rows near the viewport are rendered, scroll position gets corrected)
      const VTURNS = [];
      for (let i = 0; i < 12; i++) {
        VTURNS.push({ role: 'user', text: `سؤال شماره ${i + 1}: درباره‌ی مبحث ${i + 1} توضیح بده.` });
        VTURNS.push({
          role: 'assistant',
          blocks: [
            ['h2', `مبحث ${i + 1}: مقدمه`],
            ['p', `این پاراگراف اول مبحث ${i + 1} است و برای آزمایش فهرست خودکار نوشته شده. متن کمی طولانی است تا ارتفاع ردیف واقعی‌تر باشد و اسکرول معنا داشته باشد.`],
            ['p', `جمله‌ی دوم مبحث ${i + 1}: فهرست باید بتواند حتی وقتی این بخش در صفحه نیست، به آن برسد.`],
            ['h3', `مبحث ${i + 1}: جمع‌بندی`],
            ['p', `جمع‌بندی مبحث ${i + 1}: اگر روی این عنوان در فهرست کلیک شود، صفحه باید دقیقاً به همین‌جا بیاید.`],
            ['p', 'یک پاراگراف دیگر برای پر کردن صفحه و نزدیک‌تر شدن به ارتفاع پاسخ‌های واقعی Claude که معمولاً چند پاراگراف دارند.'],
          ],
        });
      }

      function VirtualApp() {
        const scRef = React.useRef(null);
        const heights = React.useRef({});
        const [range, setRange] = React.useState([0, 5]);
        const [, setTick] = React.useState(0);
        const est = (i) => heights.current[i] || 420;
        const recompute = () => {
          const sc = scRef.current;
          if (!sc) return;
          const top = sc.scrollTop - 600;
          const bottom = sc.scrollTop + sc.clientHeight + 600;
          let y = 0;
          let a = null;
          let b = VTURNS.length - 1;
          for (let i = 0; i < VTURNS.length; i++) {
            const h = est(i);
            if (a === null && y + h >= top) a = i;
            if (y > bottom) {
              b = i - 1;
              break;
            }
            y += h;
          }
          setRange([a || 0, Math.max(a || 0, b)]);
        };
        React.useEffect(() => {
          document.title = 'Virtual chat - Claude';
          const sc = scRef.current;
          const onScroll = () => {
            recompute();
            // like Claude's "stays put" sizer: programmatic scroll writes that
            // cancel any smooth scroll in progress
            requestAnimationFrame(() => {
              sc.scrollTop = sc.scrollTop;
            });
          };
          sc.addEventListener('scroll', onScroll);
          recompute();
          return () => sc.removeEventListener('scroll', onScroll);
        }, []);
        const measure = (i) => (el) => {
          if (!el) return;
          const h = el.getBoundingClientRect().height;
          if (h && Math.abs((heights.current[i] || 0) - h) > 1) {
            heights.current[i] = h;
            setTick((t) => t + 1);
          }
        };
        const [a, b] = range;
        let before = 0;
        for (let i = 0; i < a; i++) before += est(i);
        let after = 0;
        for (let i = b + 1; i < VTURNS.length; i++) after += est(i);
        const rows = [];
        for (let i = a; i <= b; i++) {
          rows.push(
            e(
              'div',
              { key: i, 'data-testid': 'transcript-row', 'data-index': i, ref: measure(i), style: { paddingBottom: 18 } },
              e(Message, { m: VTURNS[i] })
            )
          );
        }
        return e(
          'div',
          { className: 'app' },
          e('aside', { style: { width: 230, padding: 16 } }, e('b', null, 'Claude')),
          e(
            'main',
            { className: 'scroller', ref: scRef, style: { scrollBehavior: 'smooth' } },
            e('div', { className: 'column', role: 'feed', 'aria-label': 'Chat messages' }, e('div', { style: { height: before } }), rows, e('div', { style: { height: after } })),
            e('div', { className: 'composer' }, e('div', { className: 'ProseMirror', contentEditable: true, suppressContentEditableWarning: true }, e('p', null)))
          )
        );
      }

      function App() {
        const [path, setPath] = React.useState(location.pathname);
        const [tick, setTick] = React.useState(0);
        const [gen, setGen] = React.useState(0);
        const [stream, setStream] = React.useState(null);
        React.useEffect(() => {
          window.__nav = (p) => { history.pushState({}, '', p); setPath(p); };
          window.__rerender = () => setTick((t) => t + 1);
          window.__remount = () => setGen((g) => g + 1);
          window.__stream = (words, done) => setStream(words == null ? null : { words, done });
          const onPop = () => setPath(location.pathname);
          addEventListener('popstate', onPop);
          return () => removeEventListener('popstate', onPop);
        }, []);
        const id = (path.match(/\/chat\/([\w-]+)/) || [])[1];
        const conv = CONVS[id];
        React.useEffect(() => { document.title = (conv ? conv.title : 'New chat') + ' - Claude'; }, [conv]);
        const messages = conv ? conv.messages : [];
        return e(
          'div',
          { className: 'app' },
          e('nav', null, e('b', null, 'Claude'), Object.entries(CONVS).map(([k, c]) =>
            e('a', { key: k, href: '/chat/' + k, onClick: (ev) => { ev.preventDefault(); window.__nav('/chat/' + k); } }, c.title))),
          e(
            'main',
            { className: 'scroller' },
            e(
              'div',
              { className: 'column', key: gen, 'data-tick': tick },
              messages.map((m, i) => e(Message, { key: id + i, m })),
              stream && e(Message, { key: 'stream', m: { role: 'assistant', blocks: [['p', stream.words]] }, streaming: !stream.done })
            ),
            e('div', { className: 'composer' }, e('div', { className: 'ProseMirror', contentEditable: true, suppressContentEditableWarning: true }, e('p', null)))
          )
        );
      }
      // Claude's own floating «Reply» button above a selection
      (() => {
        const btn = document.createElement('button');
        btn.textContent = 'Reply ↩';
        btn.className = 'mock-reply';
        btn.style.cssText = 'position:fixed;display:none;z-index:50;padding:6px 12px;border-radius:8px;background:#1f1e1d;color:#fff;font:600 14px system-ui';
        document.body.appendChild(btn);
        document.addEventListener('mouseup', () =>
          setTimeout(() => {
            const sel = getSelection();
            if (!sel.rangeCount || sel.isCollapsed || !sel.anchorNode.parentElement.closest('.standard-markdown')) return (btn.style.display = 'none');
            const r = sel.getRangeAt(0).getBoundingClientRect();
            btn.style.display = 'block';
            btn.style.left = r.left + r.width / 2 - 40 + 'px';
            btn.style.top = r.top - 44 + 'px';
          }, 60)
        );
        document.addEventListener('selectionchange', () => getSelection().isCollapsed && (btn.style.display = 'none'));
      })();

      if (location.pathname.startsWith('/code/')) {
        const h = document.documentElement;
        h.removeAttribute('data-theme');
        h.removeAttribute('data-mode');
        h.removeAttribute('data-color-version');
        h.className = 'v3 dark';
        ReactDOM.createRoot(document.getElementById('root')).render(e(CodeApp));
      } else if (location.pathname.includes('22222222-3333')) {
        document.documentElement.classList.add('scroll-smooth');
        document.documentElement.style.scrollBehavior = 'smooth';
        ReactDOM.createRoot(document.getElementById('root')).render(e(VirtualApp));
      } else {
        ReactDOM.createRoot(document.getElementById('root')).render(e(App));
      }
    </script>
  </body>
</html>
